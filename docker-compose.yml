services:
  serve:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: nvidia-playgroud-go:local
    ports:
      - "8080:8080"
    restart: unless-stopped
    command: ["-auto", "-addr", ":8080"]
    environment:
      # 上游 API 代理（无浏览器时同样生效）；默认空值走系统直连
      CHROME_PROXY: ${CHROME_PROXY:-}

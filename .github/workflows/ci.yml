name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          install-mode: goinstall
          only-new-issues: true
          args: --timeout=5m

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Run tests
        if: runner.os != 'Windows'
        run: go test -race -vet=all ./...
        env:
          SKIP_INTEGRATION_TESTS: "1"
      # v8go ships no Windows prebuilt libv8 (only linux/darwin/android);
      # the packages importing it cannot build on Windows. Test the
      # client-facing core there; every other package is covered by the
      # linux/macos legs of this matrix.
      - name: Run tests (Windows core)
        if: runner.os == 'Windows'
        run: go test -race -vet=all ./ glm52-nvidia/internal/hcaptchapow glm52-nvidia/internal/models
        env:
          SKIP_INTEGRATION_TESTS: "1"

  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: ""
          go-package: ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, vulncheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Build
        run: go build -trimpath -ldflags="-s -w" ./cmd/serve
